name = "navy-fortress-api"
main = "src/worker.js"
compatibility_date = "2024-02-12"

# Database
[[d1_databases]]
binding = "DB"
database_name = "usn_db"
database_id = "82691be5-6bce-494a-85b8-7c5fb3aa9638"

# Environment variables
[vars]
ENVIRONMENT = "production"
JWT_SECRET = "your-secret-here"

[build]
command = "npm run build"
watch_dir = "src"

[env.production]
vars = { ENVIRONMENT = "production" }